<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#73a5ff"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#fbbf24"/></marker></defs><rect width="1920" height="1080" fill="#0b1220"/><g font-family="Microsoft YaHei, sans-serif"><text x="100" y="85" font-size="43" fill="#dce8f7">01 · LED 与按键：轮询、去抖、按时间翻转</text><text x="100" y="140" font-size="25" fill="#9eb3cf">主循环每轮延时 10 ms；去抖状态决定 LED 翻转间隔</text><text x="100" y="205" font-size="28" fill="#73a5ff">前台主循环</text><text x="1040" y="205" font-size="28" fill="#50d7ce">去抖条件分支与 LED 输出决策</text><rect x="100" y="245" width="780" height="106" rx="18" fill="#142339" stroke="#73a5ff" stroke-width="2"/><text x="124" y="284" font-size="29" fill="#dce8f7">系统与按键初始化</text><text x="124" y="322" font-size="22" fill="#aec2db">mx_system_init → button_init → LED 熄灭</text><rect x="100" y="395" width="780" height="106" rx="18" fill="#142339" stroke="#73a5ff" stroke-width="2"/><text x="124" y="434" font-size="29" fill="#dce8f7">读取当前按键样本</text><text x="124" y="472" font-size="22" fill="#aec2db">button_get_state，每轮读取一次</text><rect x="100" y="545" width="780" height="106" rx="18" fill="#142339" stroke="#73a5ff" stroke-width="2"/><text x="124" y="584" font-size="29" fill="#dce8f7">更新软件去抖状态</text><text x="124" y="622" font-size="22" fill="#aec2db">last_sample / stable_time_ms / stable_state</text><rect x="100" y="695" width="780" height="106" rx="18" fill="#142339" stroke="#73a5ff" stroke-width="2"/><text x="124" y="734" font-size="29" fill="#dce8f7">更新 LED，再等待 10 ms</text><text x="124" y="772" font-size="22" fill="#aec2db">app_led_update → HAL_Delay(10) → 下一轮</text><rect x="1040" y="245" width="780" height="106" rx="18" fill="#142339" stroke="#50d7ce" stroke-width="2"/><text x="1064" y="284" font-size="29" fill="#dce8f7">分支一：样本变化，重新累计</text><text x="1064" y="322" font-size="22" fill="#aec2db">sample ≠ last_sample：保存新样本，累计时间归零</text><rect x="1040" y="395" width="780" height="106" rx="18" fill="#142339" stroke="#50d7ce" stroke-width="2"/><text x="1064" y="434" font-size="29" fill="#dce8f7">分支二：样本未变、累计不足 30 ms</text><text x="1064" y="472" font-size="22" fill="#aec2db">stable_time_ms ＜ 30 ms 时，每轮增加 10 ms</text><rect x="1040" y="545" width="780" height="106" rx="18" fill="#142339" stroke="#50d7ce" stroke-width="2"/><text x="1064" y="584" font-size="29" fill="#dce8f7">分支三：样本未变、累计已达阈值</text><text x="1064" y="622" font-size="22" fill="#aec2db">后续轮次提交 stable_state，供 LED 逻辑使用</text><rect x="1040" y="695" width="780" height="106" rx="18" fill="#142339" stroke="#50d7ce" stroke-width="2"/><text x="1064" y="734" font-size="29" fill="#dce8f7">按稳定状态选择翻转间隔</text><text x="1064" y="772" font-size="22" fill="#aec2db">松开 500 ms / 按住 100 ms；到期才 toggle</text><path d="M490 351 V385" fill="none" stroke="#73a5ff" stroke-width="4" marker-end="url(#blue)" /><path d="M490 501 V535" fill="none" stroke="#73a5ff" stroke-width="4" marker-end="url(#blue)" /><path d="M490 651 V685" fill="none" stroke="#73a5ff" stroke-width="4" marker-end="url(#blue)" /><path d="M880 598 H960 V230 H1430 V235" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#gold)" /><path d="M100 748 H54 V448 H90" fill="none" stroke="#73a5ff" stroke-width="4" marker-end="url(#blue)" /><rect x="100" y="870" width="1720" height="115" rx="16" fill="#17243a"/><text x="125" y="913" font-size="26" fill="#fbbf24">讲解重点</text><text x="125" y="953" font-size="23" fill="#dce8f7">500 ms / 100 ms 是翻转间隔；完整亮灭周期约 1 s / 0.2 s。去抖按轮次累计，并非精密 30 ms 定时。</text><text x="100" y="1032" font-size="20" fill="#8fa6c4">依据：01_LED_Button_cmake/main.c · 正常运行路径</text></g></svg>