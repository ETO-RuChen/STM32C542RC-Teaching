project: stm32c542rc-teaching
board:
  name: NUCLEO-C542RC
  board_id: MB2213
  mcu: STM32C542RCT6
toolchain:
  generator: STM32CubeMX 2.x
  ide: VS Code
  build: CMake
  debug: ST-LINK
workflow:
  default_branch: main
  integration_branch: develop
  one_goal_per_turn: true
validation:
  require_build: true
  require_hardware_test_when_applicable: true
serial:
  default_baud: 115200
  formats:
    - text
    - vofa-justfloat
